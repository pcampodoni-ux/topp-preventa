name: Relevar GAP Factory
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Precio máximo en USD (precio de lista)'
        default: '20'
  push:
    paths: ['tools/relevar_gap.mjs', 'tools/talles_gap.js']
permissions:
  contents: write
jobs:
  relevar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/relevar_gap.mjs > tools/gf_raw.json
        env: { SKIP_PDP: '1', MAX: "${{ github.event.inputs.max || '20' }}" }
      - run: node tools/talles_gap.js
      - run: |
          git config user.name "topp-bot"
          git config user.email "topp-bot@users.noreply.github.com"
          git add tools/gf_raw.json
          git commit -m "Relevamiento GAP Factory" || echo "sin cambios"
          git pull --rebase -q && git push
