name: Relevar Carters
on:
  workflow_dispatch:
  push:
    paths: ['tools/relevar_carters.js']
permissions:
  contents: write
jobs:
  relevar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/relevar_carters.js
      - run: |
          git config user.name "topp-bot"
          git config user.email "topp-bot@users.noreply.github.com"
          git add tools/carters_raw.json
          git commit -m "Relevamiento Carter's" || echo "sin cambios"
          git pull --rebase -q && git push
