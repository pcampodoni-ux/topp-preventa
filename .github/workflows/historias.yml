name: Renderizar historias
on:
  workflow_dispatch:
  push:
    paths: ['historias/*.html']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node historias/render.js historias historias/img
      - run: |
          git config user.name "topp-bot"
          git config user.email "topp-bot@users.noreply.github.com"
          git add historias/img
          git commit -m "Historias renderizadas" || echo "sin cambios"
          git push
