name: Relevar WOWCYK
# Barrido de stock de wowcyk.com 2 veces por día (8:52 y 17:52 hora Argentina) y actualización de
# mayorista-stock.html con los talles y unidades disponibles. Los precios no se recalculan acá
# (salen de tools/wowcyk_mayorista_final.json); los productos nuevos o los que la tienda bajó de precio
# quedan afuera hasta que Claude los revise con los costos.
on:
  workflow_dispatch:
  schedule:
    - cron: '52 11 * * *'
    - cron: '52 20 * * *'
  push:
    paths: ['tools/relevar_wowcyk.py', '.github/workflows/relevar-wowcyk.yml']
permissions:
  contents: write
concurrency:
  group: relevar-wowcyk
  cancel-in-progress: false
jobs:
  relevar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/relevar_wowcyk.py
      - run: python3 tools/armar_mayorista_stock.py --solo-stock
      - run: |
          git config user.name "topp-bot"
          git config user.email "topp-bot@users.noreply.github.com"
          git add tools/wowcyk_stock.json mayorista-stock.html tools/wowcyk_mayorista_revisar.json
          git commit -m "Stock mayorista WOWCYK actualizado ($(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M'))" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
